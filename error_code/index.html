</main>

<script>

    /*
     * AluaPJUnder Error Code Index
     *
     * 不自行維護錯誤代碼清單。
     *
     * 系統會直接讀取 GitHub repository
     * 的 error_code/ 目錄。
     *
     * 只有實際存在的 .html 檔案
     * 才會出現在索引中。
     */


    const GITHUB_API =
        "https://api.github.com/repos/aluapju/aluapju.github.io/contents/error_code";


    const errorList =
        document.getElementById("errorList");

    const noResult =
        document.getElementById("noResult");

    const status =
        document.getElementById("status");

    const searchInput =
        document.getElementById("errorSearch");

    const searchButton =
        document.getElementById("searchButton");


    let errorCodes = [];


    /*
     * 驗證錯誤代碼格式。
     *
     * 允許：
     *
     * A-Z
     * 0-9
     * _
     *
     * 並且必須由英文字母開頭。
     */

    function isValidErrorCode(code) {

        return /^[A-Z][A-Z0-9_]*$/.test(code);

    }


    /*
     * 從 GitHub 取得 error_code/
     * 目前實際存在的檔案。
     */

    async function loadErrorCodes() {

        try {

            const response =
                await fetch(GITHUB_API, {
                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                });


            if (!response.ok) {

                throw new Error(
                    `GitHub API HTTP ${response.status}`
                );

            }


            const files =
                await response.json();


            errorCodes =
                files
                    .filter(file =>
                        file.type === "file"
                    )
                    .filter(file =>
                        file.name
                            .toLowerCase()
                            .endsWith(".html")
                    )
                    .filter(file =>
                        file.name.toLowerCase() !==
                        "index.html"
                    )
                    .map(file =>
                        file.name.slice(
                            0,
                            -".html".length
                        ).toUpperCase()
                    )
                    .filter(code =>
                        isValidErrorCode(code)
                    )
                    .sort();


            status.style.display =
                "none";


            renderErrorCodes();


        } catch (error) {

            console.error(
                "Failed to load Error Code index:",
                error
            );


            status.textContent =
                "無法載入錯誤代碼索引。";

        }

    }


    /*
     * 顯示錯誤代碼。
     */

    function renderErrorCodes(keyword = "") {

        const query =
            keyword
                .trim()
                .toUpperCase();


        errorList.innerHTML = "";


        const results =
            errorCodes.filter(code =>
                code.includes(query)
            );


        if (results.length === 0) {

            noResult.style.display =
                "block";

            return;

        }


        noResult.style.display =
            "none";


        results.forEach(code => {

            const item =
                document.createElement("a");


            item.className =
                "error-item";


            /*
             * 錯誤代碼就是檔名。
             */

            item.href =
                `/error_code/${code}.html`;


            item.textContent =
                code;


            errorList.appendChild(item);

        });

    }


    /*
     * 搜尋。
     *
     * 如果完全符合目前存在的錯誤代碼，
     * 直接開啟對應 HTML。
     */

    function searchErrors() {

        const code =
            searchInput.value
                .trim()
                .toUpperCase();


        if (!code) {

            renderErrorCodes();

            return;

        }


        const exactMatch =
            errorCodes.find(
                item => item === code
            );


        if (exactMatch) {

            window.location.href =
                `/error_code/${exactMatch}.html`;

            return;

        }


        renderErrorCodes(code);

    }


    /*
     * 搜尋按鈕。
     */

    searchButton.addEventListener(
        "click",
        searchErrors
    );


    /*
     * 即時搜尋。
     */

    searchInput.addEventListener(
        "input",
        () => {

            searchInput.value =
                searchInput.value.toUpperCase();

            renderErrorCodes(
                searchInput.value
            );

        }
    );


    /*
     * Enter 搜尋。
     */

    searchInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                searchErrors();

            }

        }
    );


    /*
     * 載入目前目錄中的實際 HTML。
     */

    loadErrorCodes();

</script>
