<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error Code - AluaPJUnder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            background: #ffffff;
            color: #111111;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 32px;
        }

        .brand {
            color: #111111;
            text-decoration: none;

            font-size: 20px;
            font-weight: 600;
        }

        .home {
            color: #111111;
            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            transition: opacity 0.2s ease;
        }

        .home:hover {
            opacity: 0.55;
        }

        .main-content {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 72px 24px 0;
        }

        .content {
            text-align: center;
        }

        .content h1 {
            font-size: clamp(30px, 5vw, 52px);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .content p {
            margin-top: 16px;

            font-size: 16px;
            color: #666666;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a class="brand" href="/">
            AluaPJUnder
        </a>

        <a class="home" href="/">
            Home
        </a>
    </header>

    <main class="main-content">
        <div class="content">
            <h1>Error Code</h1>
            <p>錯誤代碼資訊</p>
        </div>
    </main>
</body>
</html>
