<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error Code - AluaPJUnder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            background: #ffffff;
            color: #111111;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;

            width: 100%;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 32px;

            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid #eeeeee;
        }

        .brand {
            color: #111111;
            text-decoration: none;

            font-size: 20px;
            font-weight: 600;
        }

        .home {
            color: #111111;
            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            transition: opacity 0.2s ease;
        }

        .home:hover {
            opacity: 0.55;
        }

        .container {
            width: min(900px, calc(100% - 48px));
            margin: 0 auto;

            padding: 80px 0;
        }

        .header {
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .header p {
            margin-top: 12px;

            color: #666666;
            font-size: 16px;
        }

        .search-box {
            display: flex;
            gap: 10px;

            margin-bottom: 56px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;

            height: 48px;

            padding: 0 16px;

            border: 1px solid #dcdcdc;
            border-radius: 8px;

            outline: none;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 14px;
            text-transform: uppercase;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-box input:focus {
            border-color: #999999;

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .search-box button {
            height: 48px;

            padding: 0 22px;

            border: 0;
            border-radius: 8px;

            background: #111111;
            color: #ffffff;

            font-size: 15px;
            font-family: inherit;

            cursor: pointer;

            transition: opacity 0.2s ease;
        }

        .search-box button:hover {
            opacity: 0.75;
        }

        .section-title {
            margin-bottom: 20px;

            font-size: 20px;
            font-weight: 600;
        }

        .error-list {
            display: flex;
            flex-direction: column;

            border-top: 1px solid #eeeeee;
        }

        .error-item {
            display: block;

            padding: 20px 4px;

            border-bottom: 1px solid #eeeeee;

            color: #111111;
            text-decoration: none;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 14px;
            font-weight: 600;

            transition: background 0.2s ease;
        }

        .error-item:hover {
            background: #fafafa;
        }

        .no-result {
            display: none;

            padding: 32px 4px;

            color: #777777;

            text-align: center;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0 20px;
            }

            .container {
                width: min(100% - 32px, 900px);

                padding: 56px 0;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <a class="brand" href="/">
        AluaPJUnder
    </a>

    <a class="home" href="/">
        Home
    </a>

</header>


<main class="container">

    <section class="header">

        <h1>Error Code</h1>

        <p>
            錯誤代碼索引
        </p>

    </section>


    <section class="search-box">

        <input
            type="search"
            id="errorSearch"
            placeholder="輸入錯誤代碼..."
            autocomplete="off"
            spellcheck="false"
        >

        <button
            type="button"
            id="searchButton"
        >
            搜尋
        </button>

    </section>


    <section>

        <h2 class="section-title">
            Error Code Index
        </h2>

        <div
            class="error-list"
            id="errorList"
        ></div>

        <div
            class="no-result"
            id="noResult"
        >
            找不到符合的錯誤代碼。
        </div>

    </section>

</main>


<script>

    /*
     * AluaPJUnder Error Code Index
     *
     * 規則：
     *
     * 1. 錯誤代碼全部使用大寫。
     * 2. 單字之間使用底線 (_)。
     * 3. 錯誤代碼本身就是 HTML 檔名。
     *
     * 例如：
     *
     * CPU_EXCEPTION_XX
     *
     * 對應：
     *
     * /error_code/CPU_EXCEPTION_XX.html
     */

    const errorCodes = [
        "CPU_EXCEPTION_XX"
    ];


    const errorList =
        document.getElementById("errorList");

    const noResult =
        document.getElementById("noResult");

    const searchInput =
        document.getElementById("errorSearch");

    const searchButton =
        document.getElementById("searchButton");


    /*
     * 驗證錯誤代碼格式。
     *
     * 允許：
     *
     * A-Z
     * 0-9
     * _
     *
     * 且必須以 A-Z 開頭。
     */

    function isValidErrorCode(code) {
        return /^[A-Z][A-Z0-9_]*$/.test(code);
    }


    /*
     * 顯示錯誤代碼索引。
     */

    function renderErrorCodes(keyword = "") {

        const query =
            keyword
                .trim()
                .toUpperCase();

        errorList.innerHTML = "";


        const results =
            errorCodes.filter(code =>
                code.includes(query)
            );


        if (results.length === 0) {

            noResult.style.display = "block";

            return;
        }


        noResult.style.display = "none";


        results.forEach(code => {

            const item =
                document.createElement("a");


            item.className =
                "error-item";


            /*
             * 錯誤代碼本身就是檔名。
             */

            item.href =
                `/error_code/${code}.html`;


            item.textContent =
                code;


            errorList.appendChild(item);

        });

    }


    /*
     * 執行搜尋。
     */

    function searchErrors() {

        const code =
            searchInput.value
                .trim()
                .toUpperCase();


        if (!code) {

            renderErrorCodes();

            return;
        }


        /*
         * 錯誤代碼格式錯誤時，
         * 不進行檔案導向。
         */

        if (!isValidErrorCode(code)) {

            errorList.innerHTML = "";

            noResult.textContent =
                "錯誤代碼格式無效。";

            noResult.style.display =
                "block";

            return;
        }


        /*
         * 完全符合錯誤代碼：
         *
         * 直接開啟對應 HTML。
         */

        const exactMatch =
            errorCodes.find(
                item => item === code
            );


        if (exactMatch) {

            window.location.href =
                `/error_code/${exactMatch}.html`;

            return;
        }


        /*
         * 沒有完全符合時，
         * 顯示部分搜尋結果。
         */

        noResult.textContent =
            "找不到符合的錯誤代碼。";

        renderErrorCodes(code);

    }


    /*
     * 搜尋按鈕。
     */

    searchButton.addEventListener(
        "click",
        searchErrors
    );


    /*
     * 即時搜尋。
     */

    searchInput.addEventListener(
        "input",
        () => {

            const value =
                searchInput.value
                    .toUpperCase();

            searchInput.value =
                value;

            noResult.textContent =
                "找不到符合的錯誤代碼。";

            renderErrorCodes(value);

        }
    );


    /*
     * Enter 搜尋。
     */

    searchInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                searchErrors();
            }

        }
    );


    /*
     * 初始載入。
     */

    renderErrorCodes();

</script>

</body>
</html>
